<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MesHeures V2 - Suivi d'heures</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body>
    <div id="container-principal" class="container">
        <header>
            <h1>⏱️ MesHeures V2</h1>
            <p class="subtitle">Suivi d'heures de travail simplifié·»</p>
        </header>
        
        <section id="formulaire" class="card">
            <h2>Ajouter un jour</h2>
            <form id="form-ajouter">
                <div class="form-group">
                    <label for="input-date">Date</label>
                    <input type="date" id="input-date" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="input-debut">Dé·»but</label>
                        <input type="text" id="input-debut" placeholder="8h30" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="input-fin">Fin</label>
                        <input type="text" id="input-fin" placeholder="17h00" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="input-pause">Pause</label>
                        <input type="text" id="input-pause" placeholder="1h00" value="1h00">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="input-notes">Notes (optionnel)</label>
                    <input type="text" id="input-notes" placeholder="Ex: Télétravail">
                </div>
                
                <button type="button" id="btn-ajouter" class="btn btn-primary">Ajouter</button>
            </form>
        </section>
        
        <section id="resultats" class="card">
            <h2>Ré·»sumé·»</h2>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Jours</span>
                    <span class="stat-valeur" id="total-jours">0</span>
                </div>
                
                <div class="stat-item">
                    <span class="stat-label">Heures</span>
                    <span class="stat-valeur" id="total-heures">0h00</span>
                </div>
                
                <div class="stat-item">
                    <span class="stat-label">Brut</span>
                    <span class="stat-valeur" id="total-brut">0,00 €</span>
                </div>
            </div>
            
            <div class="actions">
                <button id="btn-audit" class="btn btn-secondary">📊 Audit</button>
                <button id="btn-paie" class="btn btn-secondary">💰 Paie</button>
                <button id="btn-exporter" class="btn btn-secondary">📥 Exporter</button>
                <button id="btn-reset" class="btn btn-danger">🗑️ Reset</button>
            </div>
            
            <h3>Historique</h3>
            <ul id="liste-jours" class="liste-jours">
                <!-- Les jours s'afficheront ici -->
            </ul>
        </section>
        
        <footer>
            <p>MesHeures V2 - <small>Version corrigé·»e sans doublons</small></p>
        </footer>
    </div>
    
    <!-- Scripts dans l'ordre de déependance -->
    <script src="scripts/app-core.js"></script>
    <script src="scripts/app-parser.js"></script>
    <script src="scripts/app-ui.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
